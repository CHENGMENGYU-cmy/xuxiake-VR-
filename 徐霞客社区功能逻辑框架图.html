<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>徐霞客社区功能逻辑框架图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #f7fbf8 0%, #eef6f1 100%);
    padding: 34px 40px;
    min-width: 1000px;
  }

  .header { text-align: center; margin-bottom: 30px; }
  .header h1 { font-size: 24px; color: #0b3d2e; letter-spacing: 2px; font-weight: 800; }

  .chain { display: flex; align-items: center; justify-content: center; }
  .arrow { padding: 0 6px; color: #10b981; font-size: 22px; font-weight: 700; }

  .stage {
    min-width: 120px;
    background: #fff; border: 1.5px solid #cfe6da; border-radius: 10px;
    padding: 10px 16px 8px; text-align: center;
    box-shadow: 0 2px 8px rgba(6,95,70,0.06);
  }
  .stage .name { font-size: 14.5px; font-weight: 700; color: #0b3d2e; letter-spacing: 0.5px; }
  .stage .name .no { color: #10b981; margin-right: 2px; }
  .stage .meta { margin-top: 4px; font-size: 10.5px; color: #8aa898; }
  .meta .role { color: #0d9488; font-weight: 600; }
  .meta .st { font-weight: 600; }
  .st.done { color: #059669; }
  .st.partial { color: #d97706; }

  .subnote {
    margin: 26px auto 0; text-align: center;
    font-size: 12.5px; color: #3f5c50; letter-spacing: 0.5px; line-height: 1.8;
  }
  .subnote b { color: #065f46; }
  .subnote .sep { color: #c9ddD0; margin: 0 8px; }

  .foot { margin-top: 14px; text-align: center; font-size: 11.5px; color: #8aa898; }
</style>
</head>
<body>

  <div class="header">
    <h1>徐霞客社区功能逻辑框架图</h1>
  </div>

  <div class="chain">
    <div class="stage"><div class="name"><span class="no">①</span>闪拍采集</div><div class="meta"><span class="role">USER</span> · <span class="st done">✅</span></div></div>
    <div class="arrow">➜</div>
    <div class="stage"><div class="name"><span class="no">②</span>素材库</div><div class="meta"><span class="role">USER</span> · <span class="st done">✅</span></div></div>
    <div class="arrow">➜</div>
    <div class="stage"><div class="name"><span class="no">③</span>日记</div><div class="meta"><span class="role">USER</span> · <span class="st done">✅</span></div></div>
    <div class="arrow">➜</div>
    <div class="stage"><div class="name"><span class="no">④</span>游记</div><div class="meta"><span class="role">USER</span> · <span class="st done">✅</span></div></div>
    <div class="arrow">➜</div>
    <div class="stage"><div class="name"><span class="no">⑤</span>社区发布</div><div class="meta"><span class="role">U/M/A</span> · <span class="st done">✅</span></div></div>
    <div class="arrow">➜</div>
    <div class="stage"><div class="name"><span class="no">⑥</span>社交互动</div><div class="meta"><span class="role">USER</span> · <span class="st partial">⚠️</span></div></div>
  </div>

  <div class="subnote">
    <b>治理与保障</b>（内容审核 · 举报 · 软删除 · 权限）<span class="sep">|</span>
    <b>AI 内容生成</b>（AI 日记 · AI 游记）
  </div>

  <div class="foot">✅ 已完成　⚠️ 部分完成　｜　角色：USER / MODERATOR / ADMIN</div>

</body>
</html>
