<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI智能眼镜多模态生活与旅行助手系统框架图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(150deg, #d6e2f2 0%, #e6eef8 50%, #f3f7fc 100%);
    padding: 22px 36px 26px;
    min-width: 1500px;
  }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { font-size: 26px; color: #16294a; letter-spacing: 2px; }
  .header .tag {
    display: inline-block; margin-top: 8px;
    font-size: 14px; color: #3b5c8f; letter-spacing: 4px;
    background: rgba(255,255,255,0.6); border: 1px solid rgba(70,110,180,0.30);
    padding: 5px 22px; border-radius: 30px;
  }

  #lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .root { position: relative; z-index: 1; display: flex; }

  .branch { display: flex; align-items: center; }
  .children { display: flex; flex-direction: column; gap: 5px; margin-left: 30px; }

  .node {
    white-space: nowrap;
    padding: 7px 15px;
    border-radius: 20px;
    font-size: 13px;
    color: #27406e;
    background: #fff;
    border: 1.5px solid #b9cdec;
  }
  .n0 {
    font-size: 19px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, #2f5e9e, #4a7bbf);
    border: none; padding: 16px 26px; border-radius: 26px;
    box-shadow: 0 4px 14px rgba(47,94,158,0.35);
  }
  .n1 { font-size: 14.5px; font-weight: 700; color: #fff; background: #4a7bbf; border: none; }
  .n2 { font-size: 13.5px; font-weight: 600; background: #e7effb; border-color: #b3c8e8; }
  .n3 { font-size: 13px; background: #f4f8fd; border-color: #cddcf0; }
  .n4 { font-size: 12.5px; background: #f8fbff; border-color: #dbe6f5; color: #3a557f; }

  .foot {
    margin-top: 22px; position: relative; z-index: 1;
    background: rgba(255,255,255,0.72); border: 1px solid #c9d9ee; border-radius: 10px;
    padding: 11px 18px; font-size: 14px; color: #2c4269; text-align: center; letter-spacing: 1px;
  }
  .foot b { color: #2f5e9e; }
</style>
</head>
<body>
  <svg id="lines"></svg>

  <div class="header">
    <h1>AI 智能眼镜多模态生活与旅行助手系统框架图</h1>
    <div class="tag">记录 · 翻译 · 导航 · 智能体协同</div>
  </div>

  <div class="root" id="root"></div>

  <div class="foot">
    说明：系统以 <b>智能眼镜为核心入口</b>，联动本地 AI 与云端服务，实现 <b>记录、翻译、导航与智能体协同</b>。
  </div>

<script>
const TREE = {
  name: "AI智能眼镜多模态生活与旅行助手系统",
  children: [
    { name: "用户", children: [
      { name: "交互方式", children: [
        { name: "语音交互" },
        { name: "眼镜腿触控" },
        { name: "智能戒指控制" },
      ] },
    ] },
    { name: "AI智能眼镜系统", children: [
      { name: "硬件层", children: [
        { name: "摄像头" }, { name: "麦克风" }, { name: "扬声器" },
        { name: "定位模块" }, { name: "无线通信" },
      ] },
      { name: "活动记录功能", children: [
        { name: "照片/视频采集" },
        { name: "时间/地点/天气标注" },
        { name: "语音感受记录" },
        { name: "日志/日记/游记生成" },
        { name: "社区展示" },
      ] },
      { name: "翻译功能", children: [
        { name: "本地翻译模型" }, { name: "云端翻译模型" },
        { name: "实时翻译" }, { name: "同声传译" },
      ] },
      { name: "导航与AI导游功能", children: [
        { name: "路线规划" }, { name: "语音播报" },
        { name: "室内外导航" }, { name: "景点解说" },
      ] },
      { name: "本地AI能力", children: [
        { name: "小龙虾智能体", children: [
          { name: "任务理解" }, { name: "功能调度" },
          { name: "信息查询" }, { name: "行程总结" },
        ] },
      ] },
    ] },
    { name: "手机端APP", children: [
      { name: "APP联动控制与内容管理" },
    ] },
    { name: "云端服务平台", children: [
      { name: "内容生成" }, { name: "数据同步" }, { name: "社区平台" },
    ] },
  ],
};

function nodeEl(name, depth) {
  const d = document.createElement('div');
  d.className = 'node n' + Math.min(depth, 4);
  d.textContent = name;
  return d;
}
function render(branch, parent, depth) {
  const wrap = document.createElement('div');
  wrap.className = 'branch';
  wrap.appendChild(nodeEl(branch.name, depth));
  if (branch.children && branch.children.length) {
    const col = document.createElement('div');
    col.className = 'children';
    branch.children.forEach((c) => render(c, col, depth + 1));
    wrap.appendChild(col);
  }
  parent.appendChild(wrap);
}
render(TREE, document.getElementById('root'), 0);

function drawLines() {
  const svg = document.getElementById('lines');
  const ns = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const bodyRect = document.body.getBoundingClientRect();
  svg.setAttribute('width', bodyRect.width);
  svg.setAttribute('height', bodyRect.height);
  document.querySelectorAll('.branch').forEach((b) => {
    const col = b.querySelector(':scope > .children');
    if (!col) return;
    const p = b.querySelector(':scope > .node');
    const pRect = p.getBoundingClientRect();
    const x1 = pRect.right - bodyRect.left;
    const py = pRect.top + pRect.height / 2 - bodyRect.top;
    col.querySelectorAll(':scope > .branch > .node').forEach((cn) => {
      const cRect = cn.getBoundingClientRect();
      const x2 = cRect.left - bodyRect.left;
      const cy = cRect.top + cRect.height / 2 - bodyRect.top;
      const midX = (x1 + x2) / 2;
      const line = document.createElementNS(ns, 'path');
      line.setAttribute('d', 'M ' + x1 + ' ' + py + ' C ' + midX + ' ' + py + ', ' + midX + ' ' + cy + ', ' + x2 + ' ' + cy);
      line.setAttribute('stroke', '#9db8de');
      line.setAttribute('stroke-width', '1.6');
      line.setAttribute('fill', 'none');
      svg.appendChild(line);
    });
  });
}
window.addEventListener('load', function () { setTimeout(drawLines, 150); });
</script>
</body>
</html>
