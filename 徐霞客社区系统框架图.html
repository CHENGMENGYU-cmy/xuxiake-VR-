<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>徐霞客 AI 游记与社区系统框架图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(170deg, #eef2f9 0%, #f6f8fc 60%, #fbfcfe 100%);
    padding: 24px 40px 28px;
    min-width: 1360px;
  }
  .header { text-align: center; margin-bottom: 18px; }
  .header h1 { font-size: 26px; color: #16294a; letter-spacing: 2px; }
  .header .tag {
    display: inline-block; margin-top: 8px;
    font-size: 13px; color: #40557d; letter-spacing: 4px;
    background: rgba(255,255,255,0.7); border: 1px solid #c3d4ec;
    padding: 5px 22px; border-radius: 30px;
  }

  #lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }

  .tree { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
  .wrap { display: flex; flex-direction: column; align-items: center; }
  .row { display: flex; justify-content: center; align-items: flex-start; gap: 16px; padding-top: 30px; }

  .node {
    white-space: nowrap;
    padding: 8px 15px;
    border-radius: 11px;
    font-size: 13px;
    border: 1.5px solid #c7d8ef;
    background: #fff;
    color: #1f3a5c;
  }
  .lvl0 {
    font-size: 19px; font-weight: 700; color: #fff; letter-spacing: 1px;
    background: linear-gradient(135deg, #1e3a8a, #3b82f6);
    border: none; padding: 15px 30px; border-radius: 26px;
    box-shadow: 0 6px 18px rgba(30,58,138,0.35);
  }
  .lvl1 { font-size: 15px; font-weight: 700; color: #fff; background: #2563eb; border: none; }
  .lvl2 { font-size: 13.5px; font-weight: 600; background: #e9f0fb; border-color: #b6cdf0; }
  .lvl3 { font-size: 12.5px; background: #ffffff; border-color: #cfddf1; color: #3a557f; }

  .foot {
    margin-top: 26px; position: relative; z-index: 1;
    background: rgba(255,255,255,0.85); border: 1px solid #cddbf0; border-radius: 10px;
    padding: 11px 18px; font-size: 14px; color: #25365a; text-align: center; letter-spacing: 1px;
  }
  .foot b { color: #1e3a8a; }
</style>
</head>
<body>
  <svg id="lines">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fb3e3"/>
      </marker>
    </defs>
  </svg>

  <div class="header">
    <h1>徐霞客 AI 游记与社区系统框架图</h1>
    <div class="tag">第一级：系统主体 · 第二级：功能 · 第三级：主要内容</div>
  </div>

  <div class="tree" id="tree"></div>

  <div class="foot">
    说明：以 <b>社区为核心入口</b>，从 AI 眼镜采集到社区发布，联动本地 AI 与云端，实现 <b>"记录 → 创作 → 社交"</b> 内容闭环。
  </div>

<script>
const TREE = {
  name: "徐霞客 AI 游记与社区系统",
  children: [
    {
      name: "用户",
      children: [
        { name: "交互方式", children: [
          { name: "网页端" },
          { name: "手机端" },
        ] },
      ],
    },
    {
      name: "徐霞客社区系统",
      children: [
        { name: "采集同步", children: [
          { name: "闪拍素材" }, { name: "媒体上传" }, { name: "元数据同步" },
        ] },
        { name: "内容分层", children: [
          { name: "素材库" }, { name: "日记" }, { name: "游记" },
        ] },
        { name: "AI 生成", children: [
          { name: "AI日记" }, { name: "AI游记" }, { name: "模型引擎" },
        ] },
        { name: "社区社交", children: [
          { name: "社群" }, { name: "消息" }, { name: "推荐" }, { name: "通知" },
        ] },
        { name: "AR 媒体", children: [
          { name: "媒体上传" }, { name: "沉浸浏览" }, { name: "内容发现" },
        ] },
        { name: "治理权限", children: [
          { name: "内容审核" }, { name: "软删除" }, { name: "角色权限" },
        ] },
      ],
    },
    {
      name: "闪拍 App",
      children: [
        { name: "数据采集", children: [
          { name: "照片/视频/语音" }, { name: "同步到社区" },
        ] },
      ],
    },
    {
      name: "云端服务平台",
      children: [
        { name: "内容生成", children: [ { name: "AI 生成日记/游记" } ] },
        { name: "数据同步", children: [ { name: "多端数据一致" } ] },
        { name: "社区平台", children: [ { name: "内容沉淀与展示" } ] },
      ],
    },
  ],
};

function nodeEl(name, level) {
  const d = document.createElement('div');
  d.className = 'node lvl' + Math.min(level, 3);
  d.textContent = name;
  return d;
}
function render(node, parent, level) {
  const wrap = document.createElement('div');
  wrap.className = 'wrap';
  wrap.appendChild(nodeEl(node.name, level));
  if (node.children && node.children.length) {
    const row = document.createElement('div');
    row.className = 'row';
    node.children.forEach((c) => render(c, row, level + 1));
    wrap.appendChild(row);
  }
  parent.appendChild(wrap);
}
render(TREE, document.getElementById('tree'), 0);

function drawLines() {
  const svg = document.getElementById('lines');
  const ns = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const bodyRect = document.body.getBoundingClientRect();
  svg.setAttribute('width', document.body.scrollWidth);
  svg.setAttribute('height', document.body.scrollHeight);

  document.querySelectorAll('.wrap').forEach((w) => {
    const row = w.querySelector(':scope > .row');
    if (!row) return;
    const p = w.querySelector(':scope > .node');
    const pRect = p.getBoundingClientRect();
    const px = pRect.left + pRect.width / 2 - bodyRect.left;
    const py = pRect.bottom - bodyRect.top;
    row.querySelectorAll(':scope > .wrap > .node').forEach((cn) => {
      const cRect = cn.getBoundingClientRect();
      const cx = cRect.left + cRect.width / 2 - bodyRect.left;
      const cy = cRect.top - bodyRect.top;
      const midY = (py + cy) / 2;
      const path = document.createElementNS(ns, 'path');
      path.setAttribute('d', 'M ' + px + ' ' + py + ' L ' + px + ' ' + midY + ' L ' + cx + ' ' + midY + ' L ' + cx + ' ' + cy);
      path.setAttribute('stroke', '#8fb3e3');
      path.setAttribute('stroke-width', '1.6');
      path.setAttribute('fill', 'none');
      svg.appendChild(path);
    });
  });
}
window.addEventListener('load', function () { setTimeout(drawLines, 160); });
</script>
</body>
</html>
