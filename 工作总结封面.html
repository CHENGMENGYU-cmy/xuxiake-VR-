<!DOCTYPE html>

  /* 左上装饰圆 */

  /* 右侧细弧装饰 */
  .deco-ring {
    position: absolute;
    right: -180px; top: 220px;
    width: 460px; height: 460px;
    border-radius: 50%;
    border: 2px solid rgba(75, 118, 190, 0.18);
  }
  .deco-ring2 {
    position: absolute;
    right: -120px; top: 280px;
    width: 300px; height: 300px;
    border-radius: 50%;

    left: 64px; right: 64px;
    top: 300px;
    text-align: center;
  }
  .center .small {

    letter-spacing: 10px;
    color: #4a6ea0;
    margin-bottom: 22px;
  }
  .center h1 {
    font-size: 76px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #1c2b4a;
    line-height: 1.18;

  .divider {

    height: 3px;

    letter-spacing: 4px;

  .center .sub2 {

    left: 64px; right: 64px;
    bottom: 90px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-size: 15px;
    color: #4a5f85;
  }
  .bottom b { font-weight: 600; color: #2f5e9e; }
  .mountain {
    position: absolute;
    right: 0; bottom: 0;
    width: 560px; height: 340px;
