version: '3'

services:
  mysql:
    image: mysql:8.0
    container_name: xuxiake-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: xuxiake-root-2026
      MYSQL_DATABASE: xuxiake
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./server/sql/migrate-social-features.sql:/docker-entrypoint-initdb.d/02-social.sql
      - ./server/sql/migrate-community-space.sql:/docker-entrypoint-initdb.d/03-community.sql
      - ./server/sql/migrate-challenge-entries.sql:/docker-entrypoint-initdb.d/04-challenges.sql
      - ./server/sql/migrate-message-reactions.sql:/docker-entrypoint-initdb.d/05-reactions.sql
      - ./server/sql/migrate-location-shares.sql:/docker-entrypoint-initdb.d/06-locations.sql
      - ./server/sql/migrate-route-journey.sql:/docker-entrypoint-initdb.d/07-routes.sql
      - ./server/sql/migrate-guide-collection.sql:/docker-entrypoint-initdb.d/08-guides.sql
      - ./server/sql/migrate-media-upload.sql:/docker-entrypoint-initdb.d/09-media.sql
      - ./server/sql/migrate-conversation-status.sql:/docker-entrypoint-initdb.d/10-conversations.sql
      - ./server/sql/migrate-content-review.sql:/docker-entrypoint-initdb.d/12-review.sql
      - ./server/sql/migrate-recommendation-feedback.sql:/docker-entrypoint-initdb.d/14-recommend.sql
      - ./server/sql/migrate-ar-p2.sql:/docker-entrypoint-initdb.d/15-ar-p2.sql
      - ./server/sql/migrate-danmaku-playlist.sql:/docker-entrypoint-initdb.d/16-danmaku.sql
      - ./server/sql/migrate-vrmetadata-tab.sql:/docker-entrypoint-initdb.d/17-vrmetadata.sql
      - ./server/sql/seed.sql:/docker-entrypoint-initdb.d/20-seed.sql
      - ./server/sql/seed-notifications.sql:/docker-entrypoint-initdb.d/21-seed-notifications.sql
      - ./server/sql/seed-content-classification.sql:/docker-entrypoint-initdb.d/22-seed-classification.sql
      - ./server/sql/seed-community-experience.sql:/docker-entrypoint-initdb.d/23-seed-community.sql
    networks:
      - xuxiake-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pxuxiake-root-2026"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: xuxiake-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: xuxiake-root-2026
      DB_NAME: xuxiake
      JWT_SECRET: xuxiake-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      STORAGE_TYPE: local
      STORAGE_BASE_URL: /uploads
      PORT: 3001
      CORS_ALLOWED_ORIGINS: http://47.108.175.253,http://47.108.175.253:8888,http://47.108.175.253:3000
    volumes:
      - uploads_data:/app/uploads
    networks:
      - xuxiake-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: xuxiake-web
    restart: always
    depends_on:
      - server
    environment:
      NEXT_PUBLIC_API_URL: http://xuxiake.com/api
      NEXT_PUBLIC_WS_URL: http://xuxiake.com
    networks:
      - xuxiake-net
    ports:
      - "3000:3000"

  nginx:
    image: nginx:alpine
    container_name: xuxiake-nginx
    restart: always
    depends_on:
      - web
      - server
    ports:
      - "8888:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/uploads:ro
    networks:
      - xuxiake-net

volumes:
  mysql_data:
  uploads_data:

networks:
  xuxiake-net:
    driver: bridge
